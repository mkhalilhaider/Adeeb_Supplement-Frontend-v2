<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Title, description, canonical and Open Graph tags are rendered per page by <Seo>
         (React 19 hoists them here). Keeping copies in this file would duplicate them. -->
    <meta property="og:site_name" content="Adeeb Supplement" />

    <!-- Early connections: product images (Cloudinary) and the API. -->
    <!-- Headline font: fetched with the page so the hero doesn't reflow when it arrives. -->
    <link
      rel="preload"
      href="/src/assets/fonts/archivo-latin-400-800-w72-100.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://adeeb-supplement-backend.vercel.app" />

    <style>
      /* Paint the page tone before CSS loads so there is no white flash. */
      html {
        background: #f7f5f1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 16px; font-family: system-ui">
        Please enable JavaScript to shop at Adeeb Supplement, or call / WhatsApp 0300 0447870.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
